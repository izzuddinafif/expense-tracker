[project]
name = "expense-tracker-bot"
version = "0.1.0"
description = "Personal expense tracking Telegram bot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram==3.13.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
bot = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
testpaths = ["tests"]
